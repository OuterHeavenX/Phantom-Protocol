<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#04090e"/>
<meta name="description" content="Red Static — a build-free browser survival-action roguelite set in an original near-future military espionage universe."/>
<meta name="color-scheme" content="dark"/>
<title>Red Static</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2304090e%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%2376e7d4%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%2376e7d4%27/%3E%3Cpath d=%27M16 1v6M16 25v6M1 16h6M25 16h6%27 stroke=%27%2376e7d4%27 stroke-width=%272%27/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"/>
<!-- The boot title screen picks its artwork by viewport shape; the crossover
     sits at the geometric mean of the two frames' aspect ratios (see
     src/ui/splash.js), so only the one that will be shown is fetched. -->
<link rel="preload" as="image" type="image/webp" href="./assets/images/title-screen-wide.webp" media="(min-aspect-ratio: 11/14)"/>
<link rel="preload" as="image" type="image/webp" href="./assets/images/title-screen-tall.webp" media="(max-aspect-ratio: 11/14)"/>
<link rel="stylesheet" href="./css/main.css"/>
<link rel="stylesheet" href="./css/hud.css"/>
<link rel="stylesheet" href="./css/responsive.css"/>
</head>
<body>
<div id="app"></div>
<noscript>
  <p style="padding:24px;font-family:monospace;color:#dceef2">
    Red Static requires JavaScript. Enable it to access the operation console.
  </p>
</noscript>
<script type="module" src="./src/main.js"></script>
<script>
// Stale-module guard.
//
// This document is revalidated on every navigation; a cached ES module is not
// always, and a checkout old enough not to know a URL flag ignores it in
// silence. That failure looks exactly like "the feature is broken" — the page
// loads, the game runs, and the thing you asked for simply is not there.
//
// main.js announces itself on window. If that has not happened shortly after
// load, the scripts being executed are older than this document, and this says
// so rather than letting the page look merely uncooperative. It is a
// capability check, not a version check, so there is no number to keep in sync.
(function(){
  window.addEventListener('load',function(){
    setTimeout(function(){
      if(window.__redstatic)return;
      var wanted=/[?&]visualtest=/i.test(location.search);
      var el=document.createElement('div');
      el.setAttribute('style',
        'position:fixed;left:0;right:0;top:0;z-index:99999;padding:10px 14px;'+
        'font:600 12px/1.6 ui-monospace,monospace;color:#04090e;background:#ffb35c;'+
        'box-shadow:0 4px 18px rgba(0,0,0,.5)');
      el.innerHTML='<b>STALE SCRIPTS.</b> This page is newer than the JavaScript '+
        'your browser is running'+(wanted?', which is why <code>?visualtest=1</code> did nothing':'')+
        '. Hard-reload (<b>Ctrl/Cmd + Shift + R</b>), or check the server is '+
        'serving the checkout you think it is.';
      document.body.appendChild(el);
    },5000);
  });
})();
</script>
</body>
</html>
