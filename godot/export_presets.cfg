; Export targets for RED STATIC.
;
; Desktop is the primary target (Steam, and the Steam Deck through the Linux
; build, which runs natively rather than through Proton). Web is a second
; target that shares the same project.
;
; The two do not share a renderer. Browsers have no Vulkan, so the web export
; runs the Compatibility backend over WebGL2 and the desktop builds stay on
; Forward+. That split is set per-platform in project.godot rather than here.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/linux/redstatic.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/windows/redstatic.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
ssh_remote_deploy/enabled=false

[preset.2]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

; Threads off. The threaded template needs SharedArrayBuffer, which needs
; cross-origin isolation headers on the host. Static hosting such as GitHub
; Pages will not set those, and iOS Safari is fussy about them, so the
; single-threaded build is what actually loads everywhere.
variant/thread_support=false
variant/extensions_support=false
;
; ETC2/EAC only, no S3TC. WebGL2 is OpenGL ES 3.0, which mandates ETC2 in
; core, while S3TC is only there behind an optional extension -- so for a
; browser build ETC2 is the format that is guaranteed and S3TC is the one that
; is not. Importing both doubled every texture in the package and put it over
; Cloudflare Pages' 25 MiB per-asset limit, which is a lot of bytes to carry
; for the format that might not be there.
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
