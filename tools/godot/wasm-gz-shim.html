<script>
// Decompress the engine in the page, rather than relying on the host.
//
// Cloudflare Pages refuses any asset over 25 MiB and Godot 4.5's release wasm
// is 36.3 MiB, with no smaller template. The first attempt at this stored the
// wasm gzipped under its own name and used a _headers rule to declare
// Content-Encoding, which works locally but not on Pages: the deployed asset
// came back as 9,256,790 raw bytes, exactly the compressed size, so the header
// never reached the client and the browser would have handed gzip to
// WebAssembly and failed on the magic number.
//
// So nothing is asked of the host any more. The engine ships as an ordinary
// asset named index.wasm.gz, well under the limit and with no special headers,
// and this decompresses it here using DecompressionStream, which is standard
// in every current browser and on iOS from 16.4.
//
// Godot fetches its own wasm from inside Emscripten, so rather than replace
// the shell -- which would mean maintaining a copy of it per engine version --
// fetch is wrapped for the one URL that matters. Everything else passes
// straight through untouched.
(function () {
	var real = window.fetch.bind(window);
	var pending = null;

	function engineBytes() {
		if (pending) return pending;
		if (typeof DecompressionStream === "undefined") {
			pending = Promise.reject(new Error(
				"This browser cannot decompress the engine. It needs " +
				"DecompressionStream, which means Safari 16.4 or later, or any " +
				"current Chrome, Edge or Firefox."));
			return pending;
		}
		pending = real("index.wasm.gz").then(function (res) {
			if (!res.ok) throw new Error("index.wasm.gz: HTTP " + res.status);
			return new Response(
				res.body.pipeThrough(new DecompressionStream("gzip"))
			).arrayBuffer();
		});
		return pending;
	}

	window.fetch = function (input, init) {
		var url = typeof input === "string" ? input
			: (input && input.url) ? input.url : "";
		if (url.indexOf("index.wasm") !== -1 && url.indexOf(".gz") === -1) {
			return engineBytes().then(function (buf) {
				// instantiateStreaming checks the MIME type, so the synthesised
				// response has to claim to be wasm or it refuses the stream.
				return new Response(buf, {
					headers: { "Content-Type": "application/wasm" },
				});
			});
		}
		return real(input, init);
	};
})();
</script>
<script>
// Make the browser actually let the audio out.
//
// Two things stop a Godot web build being heard, and neither shows up as an
// error.
//
// First, the opening stretch is silent, and this part is NOT fixed here.
//
// Every browser starts an AudioContext suspended until the page has seen a
// real user gesture. The engine does resume its own -- an earlier version of
// this comment, and the commit that added it, both claimed it never does,
// which was wrong -- but not until its AudioWorklet module has loaded, and
// addModule resolves on the main thread, which the sector build and the first
// shader compiles hold for a long time.
//
// Measured in Chromium on a software rasteriser, twice, once without this
// block and once with it:
//
//   without   suspended at  1 s   worklet at 33 s   running at 39 s
//   with      suspended at  2 s   worklet at 43 s   running at 49 s
//
// The resume calls below do run -- the silent one-sample sources they start
// show up in the trace at 25 s and 31 s -- and they do not flip the state.
// Both runs go running about six seconds after the worklet connects and not
// before, so the transition is gated on the driver being up and nothing the
// page does in front of that matters. The ten-second spread between the runs
// is how long the boot happened to hold the main thread, not an effect of
// this code. So: no claim here that this shortens the silent opening. It does
// not, on the evidence.
//
// Second, and this is the iPhone-specific one: Safari on iOS routes Web Audio
// through the "ambient" audio session by default, which the hardware ring
// /silent switch mutes. A phone with the switch flicked over is silent no
// matter how correct the rest of this is -- and that is not something a
// player would think to mention, because every other app they own is still
// making noise. Declaring a playback session opts out of the switch. Safari
// 16.4 and later; the try/catch covers everything older and everything else.
// The engine does nothing about this at all.
//
// What this block is therefore actually for, stated narrowly because two
// rounds have now been lost to overclaiming here:
//
//   - the playback session, which the engine never sets and which is the only
//     thing that gets past an iPhone's silent switch;
//   - re-unlocking after the tab has been in the background, which iOS
//     suspends and which the engine only recovers from if the canvas happens
//     to be touched again;
//   - resuming from window-level gestures rather than canvas-level ones, so a
//     tap that lands on the on-screen controls still counts.
//
// The first is the one with a player report behind it. The other two are
// cheap and are not known to have been the fault.
//
// The context is reached by patching the constructor rather than by digging
// around in the engine's internals, and the listeners stay registered for the
// life of the page rather than firing once.
(function () {
	function playback() {
		try {
			if (navigator.audioSession) navigator.audioSession.type = "playback";
		} catch (e) { /* not Safari, or too old */ }
	}
	playback();

	var Native = window.AudioContext || window.webkitAudioContext;
	if (!Native) return;
	var contexts = [];

	function Patched(options) {
		var ctx = new Native(options);
		contexts.push(ctx);
		return ctx;
	}
	Patched.prototype = Native.prototype;
	window.AudioContext = Patched;
	window.webkitAudioContext = Patched;

	function unlock() {
		playback();
		for (var i = 0; i < contexts.length; i++) {
			var ctx = contexts[i];
			if (ctx.state === "running") continue;
			try { ctx.resume(); } catch (e) { /* nothing to be done */ }
			// One sample of silence, started inside the gesture. This is the
			// old iOS unlock and it still matters: resume() alone can be
			// deferred, while a source that has actually been started forces
			// the session open.
			try {
				var src = ctx.createBufferSource();
				src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
				src.connect(ctx.destination);
				src.start(0);
			} catch (e) { /* ditto */ }
		}
	}

	var events = ["touchstart", "touchend", "pointerdown", "mousedown", "keydown"];
	for (var i = 0; i < events.length; i++) {
		window.addEventListener(events[i], unlock, { capture: true, passive: true });
	}
	document.addEventListener("visibilitychange", function () {
		if (!document.hidden) unlock();
	});
})();
</script>
