# Build the Godot first-person port and deploy it to Cloudflare Pages.
#
# This is a SECOND site, separate from the one Cloudflare already builds from
# this repository. That project serves the repository root, which is the 2D
# browser game, and it keeps doing so untouched. This one deploys the 3D build
# to its own project so both stay live while the port is in progress.
#
# Cloudflare's own Git integration cannot build this: its image has no Godot,
# and the export templates are a 1.3 GB download. So the build happens here and
# only the finished bundle is uploaded.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN    scoped to Cloudflare Pages -- Edit
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy 3D build

on:
  push:
    branches: [main]
    # Only when something that changes the build changes. Most commits to this
    # repository are to the 2D game, which has its own deploy and has no
    # business triggering a fifteen-minute Godot export.
    paths:
      - 'godot/**'
      - 'tools/godot/**'
      - '.github/workflows/deploy-3d.yml'
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race to publish and the
# later-finishing one would win regardless of which commit it built.
concurrency:
  group: deploy-3d
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5-stable
  PAGES_PROJECT: red-static-3d

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The engine and its templates are 1.4 GB together and never change
      # between runs, so they are cached on the version string.
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          # Templates unpack to a directory called "templates" and have to be
          # renamed to the version Godot looks for, or the export fails with a
          # bare "configuration errors" and no further explanation.
          curl -fsSL -o /tmp/templates.tpz \
            "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -o /tmp/templates.tpz -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates
          version=$(cat /tmp/tpl/templates/version.txt)
          rm -rf ~/.local/share/godot/export_templates/"$version"
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/"$version"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Check scripts compile
        run: tools/godot/check.sh

      - name: Verify the contract still plays
        run: tools/godot/simtest.sh

      - name: Export for web
        run: tools/godot/export.sh Web

      # Fails the run if any asset is over the 25 MiB Pages refuses, which is
      # better found here than in a half-uploaded deploy.
      - name: Bundle for Pages
        run: tools/godot/pages-bundle.sh

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          # Creating a project that already exists fails, and wrangler will not
          # create a missing one from a non-interactive shell -- it asks. So it
          # is attempted every run and the failure ignored, which means the
          # first run works without anyone having clicked through the
          # dashboard first.
          npx --yes wrangler@latest pages project create "$PAGES_PROJECT" \
            --production-branch main 2>&1 | tail -2 || true

          npx --yes wrangler@latest pages deploy build/pages \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true | tee /tmp/deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]*\.pages\.dev' /tmp/deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The wasm is stored gzipped under its uncompressed name, because Godot's
      # 36.3 MiB release wasm is over the 25 MiB per-asset limit and there is no
      # smaller template. That only works while Cloudflare honours the
      # Content-Encoding header in _headers. If it ever stops, the page goes
      # white with a WebAssembly magic-number error and nothing says why, so the
      # deploy is checked rather than trusted.
      - name: Verify the served wasm decodes
        run: |
          set -eu
          url="${{ steps.deploy.outputs.url }}"
          [ -n "$url" ] || { echo "no deploy URL was printed" >&2; exit 1; }
          want=$(stat -c%s build/web/index.wasm)

          # A freshly created pages.dev subdomain answers before its TLS
          # certificate exists, so the first request after a deploy fails the
          # handshake outright. curl's --retry does not cover handshake
          # failures without --retry-all-errors, which is why the first run
          # reported zero bytes a tenth of a second after a deploy that had
          # in fact succeeded.
          if ! curl -sS --compressed --fail \
                 --retry 12 --retry-delay 10 --retry-all-errors --retry-connrefused \
                 -o /tmp/served.wasm "$url/index.wasm"; then
            echo "FAIL: could not fetch $url/index.wasm at all." >&2
            echo "      The deploy itself succeeded -- this is the check" >&2
            echo "      failing to reach it, not a bad build." >&2
            exit 1
          fi

          got=$(stat -c%s /tmp/served.wasm)
          if [ "$got" != "$want" ]; then
            echo "FAIL: served wasm decoded to $got bytes, expected $want." >&2
            echo "      Cloudflare is not honouring Content-Encoding here, so" >&2
            echo "      the build will not start. Serve index.wasm from an R2" >&2
            echo "      public bucket instead and point the shell at it." >&2
            exit 1
          fi
          echo "ok: wasm decodes to $got bytes"
          {
            echo "### 3D build deployed"
            echo
            echo "Play at https://${PAGES_PROJECT}.pages.dev"
            echo
            echo "This deployment: $url"
          } >> "$GITHUB_STEP_SUMMARY"
